<!DOCTYPE html>
<html>
<head>
    <title>Student Object</title>
</head>
<body>

<script>
let student = {
    name: "Akshadu",
    age: 22,
    course: "M.Sc Computer Science"
};

// Accessing object members
document.write("<h2>Student Details</h2>");
document.write("Name: " + student.name + "<br>");
document.write("Age: " + student.age + "<br>");
document.write("Course: " + student.course);

</script>

</body>
</html>
